name: Deploy Azure Function
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "src/function/**", ".github/workflows/deploy-function.yml" ]

env:
  PYTHON_VERSION: '3.11'
  FUNCTION_APP_PATH: './src/function'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Project Dependencies
        shell: bash
        run: |
          pushd '${{ env.FUNCTION_APP_PATH }}'
          python -m pip install --upgrade pip
          # Build for the Azure Functions Linux image, not the runner: ubuntu-latest would
          # pick wheels needing glibc 2.34+ (e.g. cryptography manylinux_2_34), which the
          # Functions Python image can't load -> import error -> no functions indexed.
          pip install -r requirements.txt --target=".python_packages/lib/site-packages" \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version ${{ env.PYTHON_VERSION }} \
            --only-binary=:all:
          popd

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: ${{ env.FUNCTION_APP_PATH }}
          respect-funcignore: true
