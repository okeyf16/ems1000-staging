name: Scaffold Monorepo Structure
on:
  workflow_dispatch: # Run manually from GitHub Actions tab

jobs:
  reorganize-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Directory Structure
        run: |
          # 1. Create target directories
          mkdir -p infra/modules/{iothub,function_app,app_service,storage,observability}
          mkdir -p infra/environments
          mkdir -p src/function
          mkdir -p src/api

          # 2. Move existing Terraform files into infra/ (if present at root)
          mv -f main.tf variables.tf outputs.tf providers.tf backend.tf infra/ 2>/dev/null || true
          mv -f environments/* infra/environments/ 2>/dev/null || true
          mv -f modules/* infra/modules/ 2>/dev/null || true

          # Clean up old empty root modules directory if it exists
          rm -rf modules environments

          # 3. Create boilerplate placeholders for Azure Function
          touch src/function/function_app.py
          touch src/function/requirements.txt
          touch src/function/host.json

          # 4. Create boilerplate placeholders for FastAPI App Service
          touch src/api/main.py
          touch src/api/requirements.txt
          touch src/api/Dockerfile

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: migrate repo to monorepo layout (infra/ & src/)" || echo "No changes to commit"
          git push
